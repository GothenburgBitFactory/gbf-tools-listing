[project]
name = "tools-list"
version = "0.1.0"
description = "Generate and maintain the tools listings for taskwarrior.org and timewarrior.net"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyGithub >= 2.9",
]

[project.scripts]
tools-list = "tools_list.cli:main"

[dependency-groups]
dev = [
    "pytest >= 8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
